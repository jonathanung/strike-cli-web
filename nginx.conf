server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS for dynamic proxy_pass (Alpine)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location = /install {
        set $install_upstream https://raw.githubusercontent.com/jonathanung/strike-cli/main/scripts/install.sh;
        proxy_pass $install_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header Accept text/plain;
        proxy_intercept_errors off;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Content-Type;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
        # Do NOT fall through to SPA
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
