<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Strike isolated worktrees</title>
  <desc id="desc">Concurrent roots with worktree isolation under .strike/worktrees.</desc>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="960" height="600" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="600" fill="#0c0b10"/>
    <rect x="0" y="0" width="960" height="36" fill="#14121a"/>
    <circle cx="22" cy="18" r="5" fill="#f472b6"/>
    <circle cx="40" cy="18" r="5" fill="#f0b429"/>
    <circle cx="58" cy="18" r="5" fill="#4ade80"/>
    <text x="84" y="22" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">⚡ strike</text>
    <text x="170" y="22" fill="#f0b429" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">--worktree</text>
    <text x="720" y="22" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">isolated roots</text>
    <rect x="12" y="48" width="460" height="480" rx="8" fill="#121018" stroke="#2e2838"/>
    <rect x="12" y="48" width="460" height="28" rx="8" fill="#1a1722"/>
    <rect x="12" y="64" width="460" height="12" fill="#1a1722"/>
    <text x="28" y="68" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">agents</text>
    <text x="28" y="110" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">● main</text>
    <text x="120" y="110" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">repo root</text>
    <text x="320" y="110" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">ready</text>
    <text x="28" y="148" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">● wt-feature</text>
    <text x="160" y="148" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">worktree</text>
    <text x="320" y="148" fill="#f0b429" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">working</text>
    <text x="48" y="176" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">.strike/worktrees/wt-feature</text>
    <text x="28" y="216" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">○ wt-ci</text>
    <text x="120" y="216" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">worktree</text>
    <text x="320" y="216" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">ready</text>
    <text x="48" y="244" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">.strike/worktrees/wt-ci</text>
    <text x="28" y="300" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">n new root · worktree auto for 2nd+</text>
    <text x="28" y="324" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">strike --worktree  · config worktree</text>
    <rect x="488" y="48" width="460" height="480" rx="8" fill="#121018" stroke="#2e2838"/>
    <rect x="488" y="48" width="460" height="28" rx="8" fill="#1a1722"/>
    <rect x="488" y="64" width="460" height="12" fill="#1a1722"/>
    <text x="504" y="68" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">session · wt-feature</text>
    <text x="504" y="110" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">you</text>
    <text x="544" y="110" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Implement the feature branch changes</text>
    <text x="504" y="130" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">without touching main checkout files.</text>
    <text x="504" y="168" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">assistant</text>
    <text x="584" y="168" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Working inside isolated worktree.</text>
    <rect x="504" y="188" width="420" height="72" rx="6" fill="#1a1722" stroke="#2e2838"/>
    <text x="520" y="214" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">tool  bash</text>
    <text x="520" y="236" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">git status -sb</text>
    <text x="520" y="254" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">## feature/auth-fix</text>
    <text x="504" y="300" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">workdir</text>
    <text x="584" y="300" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">.strike/worktrees/wt-feature</text>
    <text x="504" y="330" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">branch</text>
    <text x="584" y="330" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">feature/auth-fix</text>
    <text x="504" y="360" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">main root stays clean for parallel work</text>
    <rect x="0" y="548" width="960" height="52" fill="#14121a"/>
    <text x="24" y="578" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">worktrees keep concurrent agents from colliding on disk</text>
  </g>
</svg>
