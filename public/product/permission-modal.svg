<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Strike permission modal</title>
  <desc id="desc">Centered permission prompt over the multi-pane cockpit for a bash tool call.</desc>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="960" height="600" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="600" fill="#0c0b10"/>
    <!-- dimmed chrome -->
    <rect x="0" y="0" width="960" height="36" fill="#14121a" opacity="0.55"/>
    <text x="84" y="22" fill="#a78bfa" opacity="0.55" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">⚡ strike</text>
    <rect x="12" y="48" width="580" height="480" rx="8" fill="#121018" stroke="#2e2838" opacity="0.45"/>
    <rect x="604" y="48" width="344" height="232" rx="8" fill="#121018" stroke="#2e2838" opacity="0.45"/>
    <rect x="604" y="292" width="344" height="236" rx="8" fill="#121018" stroke="#2e2838" opacity="0.45"/>
    <rect x="0" y="0" width="960" height="600" fill="#0c0b10" opacity="0.55"/>
    <!-- modal -->
    <rect x="230" y="150" width="500" height="300" rx="12" fill="#1a1722" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="230" y="150" width="500" height="40" rx="12" fill="#2a2140"/>
    <rect x="230" y="178" width="500" height="12" fill="#2a2140"/>
    <text x="250" y="176" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">permission</text>
    <text x="640" y="176" fill="#f0b429" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">ask</text>
    <text x="250" y="220" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">tool</text>
    <text x="320" y="220" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">bash</text>
    <text x="250" y="248" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">command</text>
    <rect x="250" y="260" width="460" height="56" rx="6" fill="#121018" stroke="#2e2838"/>
    <text x="266" y="284" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">go test ./internal/auth/... -count=1</text>
    <text x="266" y="304" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">cwd ~/proj/api · network no</text>
    <text x="250" y="348" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Allow this tool call?</text>
    <!-- choices -->
    <rect x="250" y="368" width="140" height="36" rx="8" fill="#2a2140" stroke="#a78bfa"/>
    <text x="278" y="391" fill="#f4f0fa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">allow once</text>
    <rect x="404" y="368" width="150" height="36" rx="8" fill="#121018" stroke="#2e2838"/>
    <text x="424" y="391" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">allow session</text>
    <rect x="568" y="368" width="100" height="36" rx="8" fill="#121018" stroke="#2e2838"/>
    <text x="598" y="391" fill="#f472b6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">deny</text>
    <text x="250" y="430" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">↑↓ select · enter confirm · esc deny · mode soft-approve</text>
  </g>
</svg>
