<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Strike @file mention picker</title>
  <desc id="desc">Composer @-mention fuzzy file completion attaching project paths into the prompt.</desc>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="960" height="600" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="600" fill="#0c0b10"/>
    <rect x="0" y="0" width="960" height="36" fill="#14121a"/>
    <circle cx="22" cy="18" r="5" fill="#f472b6"/>
    <circle cx="40" cy="18" r="5" fill="#f0b429"/>
    <circle cx="58" cy="18" r="5" fill="#4ade80"/>
    <text x="84" y="22" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">⚡ strike</text>
    <text x="700" y="22" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">@file mention</text>
    <rect x="12" y="48" width="936" height="320" rx="8" fill="#121018" stroke="#2e2838"/>
    <rect x="12" y="48" width="936" height="28" rx="8" fill="#1a1722"/>
    <rect x="12" y="64" width="936" height="12" fill="#1a1722"/>
    <text x="28" y="68" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">session · transcript</text>
    <text x="28" y="110" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">you</text>
    <text x="68" y="110" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Review the permission policy against the docs.</text>
    <text x="28" y="142" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">assistant</text>
    <text x="108" y="142" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Ready — attach the files you want in scope.</text>
    <!-- composer with @ picker -->
    <rect x="12" y="388" width="936" height="148" rx="8" fill="#1a1722" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="32" y="420" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">prompt ❯</text>
    <text x="116" y="420" fill="#e4e0ec" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">compare @permi</text>
    <rect x="248" y="408" width="8" height="16" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- completion popup -->
    <rect x="116" y="436" width="420" height="84" rx="8" fill="#121018" stroke="#2e2838"/>
    <rect x="116" y="436" width="420" height="28" fill="#2a2140"/>
    <text x="132" y="455" fill="#f4f0fa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">@internal/permission/policy.go</text>
    <text x="132" y="483" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">@docs/config.md</text>
    <text x="132" y="507" fill="#9b93a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">@internal/permission/</text>
    <text x="32" y="520" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">↑↓ · tab/enter insert · esc dismiss · folder attaches listing only</text>
    <rect x="0" y="548" width="960" height="52" fill="#14121a"/>
    <text x="24" y="578" fill="#6b6580" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">@path attaches under project root · emails ignored</text>
  </g>
</svg>
